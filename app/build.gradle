plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ticmouseproto'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ticmouseproto"
        minSdk 30
        targetSdk 33
        versionCode 3
        versionName "0.3-prototype"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No external dependencies: the prototype uses only the Android framework.
dependencies {
}
